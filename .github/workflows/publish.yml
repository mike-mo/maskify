name: 'GitHub release: Attach packages'

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing stable GitHub release tag, v1.3.0+ (blank: latest stable)'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: maskify-release-artifacts
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    # GitHub requires push access to discover draft release metadata.
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.target.outputs.tag }}
      commit: ${{ steps.target.outputs.commit }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Resolve stable release and exact tag commit
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: node scripts/release-assets.js resolve

  verify:
    needs: resolve
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.resolve.outputs.commit }}
      tag: ${{ needs.resolve.outputs.tag }}

  upload:
    needs: [resolve, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@v7
        with:
          name: release-assets
          path: ${{ runner.temp }}/maskify-release
      - name: Verify and attach assets without replacing historical bytes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.resolve.outputs.commit }}
        run: node scripts/release-assets.js upload "$RUNNER_TEMP/maskify-release"
