name: 'Pages: Deploy site'

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy the built site'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Assemble Pages source
        run: node scripts/pages.js dist/pages-source
      - name: Check public URLs and site assets
        run: node --test scripts/pages.test.js
      - uses: actions/configure-pages@v6
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./dist/pages-source
          destination: ./dist/pages-site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist/pages-site
          include-hidden-files: true
  deploy:
    if: (github.event_name == 'push' || inputs.deploy) && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deploy
