name: Generate Store Screenshots

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach screenshots to (leave blank for latest)'
        required: false

jobs:
  screenshots:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Preserve release asset selector
        run: cp scripts/release-screenshots.js "$RUNNER_TEMP/maskify-release-screenshots.js"

      - name: Resolve release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "value=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          elif [ -n "${{ inputs.tag }}" ]; then
            echo "value=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          else
            latest=$(gh release list --limit 1 --json tagName -q '.[0].tagName')
            echo "value=$latest" >> $GITHUB_OUTPUT
          fi

      - name: Validate and checkout release tag
        run: |
          TAG="${{ steps.tag.outputs.value }}"
          if [ -z "$TAG" ]; then echo "No release tag found. Create a release first or pass a tag via inputs.tag." && exit 1; fi
          git fetch --tags --depth=1 && git checkout "$TAG"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: scripts
        run: npm ci

      - name: Install Playwright browser
        working-directory: scripts
        run: npx playwright install chromium --with-deps

      - name: Generate screenshots
        working-directory: scripts
        run: |
          if [ ! -f release-screenshots.js ]; then
            echo "Generating legacy screenshots for this older release tag."
            export TESTPAGE_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/testpage.html"
          fi
          xvfb-run --auto-servernum node screenshot.js

      - name: Package and upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.value }}"
          REPO="${{ github.repository }}"
          BASE_URL="https://github.com/${REPO}/releases/download/${TAG}"

          node "$RUNNER_TEMP/maskify-release-screenshots.js" "$GITHUB_WORKSPACE" > "$RUNNER_TEMP/maskify-assets.json"
          GENERATION=$(jq -r '.generation' "$RUNNER_TEMP/maskify-assets.json")
          echo "Packaging $GENERATION screenshot assets."
          mapfile -t FILES < <(jq -r '.files[]' "$RUNNER_TEMP/maskify-assets.json")
          zip screenshots.zip "${FILES[@]}"

          ASSETS=()
          while IFS=$'\t' read -r FILE ASSET TITLE; do
            cp "$FILE" "$ASSET"
            ASSETS+=("$ASSET")
          done < <(jq -r '.english[] | [.path, .asset, .title] | @tsv' "$RUNNER_TEMP/maskify-assets.json")

          # Upload assets (--clobber replaces if workflow is re-run)
          gh release upload "$TAG" screenshots.zip "${ASSETS[@]}" --clobber

          # Get current release body, remove any previous autogenerated screenshots block, append new one
          BEGIN_MARKER='<!-- BEGIN AUTOGENERATED SCREENSHOTS -->'
          END_MARKER='<!-- END AUTOGENERATED SCREENSHOTS -->'

          gh release view "$TAG" --json body -q .body > current-notes.md

          awk -v begin="$BEGIN_MARKER" -v end="$END_MARKER" '
            $0 == begin { in_block=1; next }
            $0 == end { in_block=0; next }
            !in_block { print }
          ' current-notes.md > notes.md

          printf '\n%s\n## Screenshots\n\n' "$BEGIN_MARKER" >> notes.md
          while IFS=$'\t' read -r FILE ASSET TITLE; do
            printf '### %s\n\n![%s](%s/%s)\n\n' "$TITLE" "$TITLE" "$BASE_URL" "$ASSET" >> notes.md
          done < <(jq -r '.english[] | [.path, .asset, .title] | @tsv' "$RUNNER_TEMP/maskify-assets.json")
          printf '%s\n' "$END_MARKER" >> notes.md

          gh release edit "$TAG" --notes-file notes.md
