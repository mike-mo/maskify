name: Attach approved release assets

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing stable release tag, v1.3.0+ (blank selects GitHub stable latest)'
        type: string
        required: false

permissions:
  contents: write

jobs:
  assets:
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ inputs.tag }}
