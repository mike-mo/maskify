name: CI

on:
  pull_request:
  push:
  workflow_call:
    inputs:
      ref:
        description: 'Exact source commit to verify and package'
        type: string
        required: true
      tag:
        description: 'Release tag to check against manifest.json'
        type: string
        required: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: scripts/package-lock.json
      - name: Install locked dependencies
        run: npm --prefix scripts ci --ignore-scripts
      - name: Install Playwright Chromium
        working-directory: scripts
        run: npx playwright install chromium --with-deps
      - name: Test runtime, approved artwork, store packs, and release safety
        run: npm --prefix scripts test
      - name: Build verified release assets
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: node scripts/release-assets.js build "$RUNNER_TEMP/maskify-release"
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: ${{ runner.temp }}/maskify-release/*
          if-no-files-found: error
          retention-days: 7
