<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Maskify</title>
  <style>
    :root {
      color-scheme: light;
      --background: #fff;
      --surface: #f5f5f5;
      --input-background: #fff;
      --text: #1a1a1a;
      --text-secondary: #595959;
      --border: #ccc;
      --separator: #e8e8e8;
      --accent: #0078d4;
      --button-background: #0078d4;
      --button-hover: #106ebe;
      --button-active: #005a9e;
      --button-text: #fff;
      --invalid: #d93025;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --background: #1e1e1e;
        --surface: #2d2d2d;
        --input-background: #2d2d2d;
        --text: #e0e0e0;
        --text-secondary: #aaa;
        --border: #555;
        --separator: #444;
        --accent: #4da6ff;
        --button-background: #005a9e;
        --button-hover: #0078d4;
        --button-active: #004578;
        --invalid: #ff6b60;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      font-size: 13px;
      color: var(--text);
      background: var(--background);
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--separator);
    }

    .header img {
      width: 20px;
      height: 20px;
    }

    .header h1 {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.1px;
    }

    .body {
      padding: 14px 16px 16px;
    }

    .description {
      color: var(--text-secondary);
      line-height: 1.5;
      margin-bottom: 12px;
    }

    .field {
      margin-bottom: 12px;
    }

    .field-label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.3px;
      text-transform: uppercase;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    .domain-input {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 13px;
      font-family: inherit;
      color: var(--text);
      background: var(--input-background);
      outline: 2px solid transparent;
      outline-offset: 1px;
    }

    .domain-input:focus {
      border-color: var(--accent);
      outline-color: var(--accent);
    }

    .domain-input.invalid,
    .domain-input.invalid:focus {
      border-color: var(--invalid);
    }

    .domain-input.invalid:focus {
      outline-color: var(--invalid);
    }

    input[type="checkbox"] {
      accent-color: var(--accent);
    }

    input[type="checkbox"]:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
    }

    button {
      width: 100%;
      padding: 8px 16px;
      background: var(--button-background);
      color: var(--button-text);
      border: none;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.1s;
    }

    button:hover  { background: var(--button-hover); }
    button:active { background: var(--button-active); }

    button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .donate-link {
      display: none;
      margin-top: 10px;
      text-align: center;
      font-size: 11px;
      color: var(--text-secondary);
      text-decoration: none;
    }

    .donate-link.visible { display: block; }

    .donate-link:hover { color: var(--text); }

    .preview {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      padding: 7px 10px;
      background: var(--surface);
      border-radius: 4px;
    }

    .preview-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.3px;
      text-transform: uppercase;
      color: var(--text-secondary);
      flex-shrink: 0;
    }

    .preview code {
      font-size: 12px;
      color: var(--accent);
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="../icons/maskify32x32.png" alt="" />
    <h1 id="popupTitle">Maskify</h1>
  </div>
  <div class="body">
    <p id="popupDescription" class="description">Replace email addresses on this page with made-up ones.</p>
    <div class="field">
      <label id="labelDomain" class="field-label" for="domainInput">Domain</label>
      <input type="text" id="domainInput" class="domain-input" placeholder="example.com" />
    </div>
    <div class="field">
      <label class="checkbox-label">
        <input type="checkbox" id="addNumber" />
        <span id="labelAddNumber">Add number (e.g. alice<strong>7</strong>)</span>
      </label>
    </div>
    <div class="field">
      <label class="checkbox-label">
        <input type="checkbox" id="addLastInitial" />
        <span id="labelAddLastInitial">Add random initial (e.g. alice<strong>_r</strong>)</span>
      </label>
    </div>
    <div class="field">
      <label class="checkbox-label">
        <input type="checkbox" id="showAsterisk" />
        <span id="labelShowAsterisk">Mark replacements with ***</span>
      </label>
    </div>
    <div class="preview">
      <span id="labelPreview" class="preview-label">Preview</span>
      <code id="previewAddress"></code>
    </div>
    <button id="sendmessageid">Mask Emails</button>
    <a id="donateLink" class="donate-link" href="https://buymeacoffee.com/mikemo" target="_blank" rel="noopener noreferrer">Buy me a coffee ☕</a>
  </div>
  <script src="../data/domain-utils.js"></script>
  <script src="popup.js"></script>
</body>
</html>
